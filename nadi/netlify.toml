# Netlify: set "Base directory" to `nadi` when importing the repo.
# Netlify detects Next.js and runs it with its Next.js runtime.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime (server pages, API routes, proxy). Listed explicitly
# because the site was first created from a branch without Next.js.
[[plugins]]
  package = "@netlify/plugin-nextjs"

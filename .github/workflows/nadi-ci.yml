name: Nadi CI

on:
  push:
    paths: ["nadi/**", ".github/workflows/nadi-ci.yml"]
  pull_request:
    paths: ["nadi/**", ".github/workflows/nadi-ci.yml"]

concurrency:
  group: nadi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nadi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nadi/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build (against the e2e mock)
        run: npm run build:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            nadi/playwright-report
            nadi/test-results
          retention-days: 7
